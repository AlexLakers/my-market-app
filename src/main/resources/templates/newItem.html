<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Панель админа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <h2>
                    <span class="badge text-bg-success">Панель админа</span>
                </h2>
                <a href="/orders" class="btn btn-secondary ms-auto bi bi-file-earmark-text"> Заказы</a>
                <a href="/cart/items" class="btn btn-secondary bi bi-cart4"> Корзина</a>
                <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> Главная</a>
            </div>
        </div>
    </div>

    <form th:action="@{/items/new}" method="post" enctype="multipart/form-data"
          class="p-4 border rounded shadow-sm bg-white"
    >

        <h5 class="mb-3 text-success">Добавить товар</h5>
        <div th:if="${errors}">
            <span style="color: red" th:each="error : ${errors}" th:text="${error.defaultMessage}">Invalid Data</span>
        </div>
        <div class="mb-3">
            <label class="form-label">Название</label>
            <input type="text" name="title" th:value="${title}" class="form-control" placeholder="Введите название"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Описание</label>
            <input type="text" name="description" class="form-control" th:value="${description}"
                   placeholder="Введите описание">
        </div>

        <div class="mb-3">
            <label class="form-label">Цена</label>
            <input type="number" name="price" class="form-control" th:value="${price}" placeholder="Введите цену"
                   required>
        </div>
        <div class="alert alert-info">
            <small>
                <strong>Изображение:</strong> Вы сможете загрузить изображение на следующем шаге
                после создания товара. Это позволит сначала заполнить все данные, а потом добавить
                подходящее изображение.
            </small>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a href="/items" class="btn btn-outline-secondary">Назад</a>
            <button type="submit" class="btn btn-success">Добавить</button>
        </div>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
