<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <title>Добавление изображения</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <a href="/orders" class="btn btn-secondary ms-auto bi bi-file-earmark-text"> Заказы</a>
                <a href="/cart/items" class="btn btn-secondary bi bi-cart4"> Корзина</a>
                <a href="/items" class="btn btn-secondary bi bi-arrow-left-square"> Главная</a>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title text-success">
                <i class="bi bi-check-circle"></i> Товар успешно создан!
            </h5>
            <p class="card-text">
                <strong>ID товара:</strong> <span class="badge bg-info" th:text="${item.id()}"></span><br>
                <strong>Название:</strong> <span th:text="${item.title()}"></span><br>
                <strong>Описание:</strong> <span
                    th:text="${item.description() != null ? item.description() : 'Нет описания'}"></span><br>
                <strong>Цена:</strong> <span th:text="${item.price()}"></span> ₽
            </p>
        </div>
    </div>

    <form th:action="@{/items/{itemId}/images/new(itemId=${item.id()})}" method="post" enctype="multipart/form-data"
          class="p-4 border rounded shadow-sm bg-white"
    >
        <h5 class="mb-3 text-success">Добавить изображение</h5>
        <div class="mb-3">
            <label class="form-label">Выберите изображение товара</label>
            <input type="file" name="image" class="form-control" accept="image/*">
            <div class="form-text">
                Поддерживаемые форматы: JPG, PNG, GIF. Максимальный размер: 5MB.
                Имя файла будет сгенерировано автоматически.
            </div>
        </div>
        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{'/items/' + ${item.id()}}" class="btn btn-outline-secondary">
                <i class="bi bi-skip-forward"></i> Пропустить шаг
            </a>
            <button type="submit" class="btn btn-success">
                <i class="bi bi-upload"></i> Загрузить изображение
            </button>
        </div>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>
</html>
