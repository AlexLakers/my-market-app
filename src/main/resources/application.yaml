server:
  port: ${APP_PORT:8080}

spring:
  threads:
    virtual:
      enabled: true

  application:
    name: my-market-app

  main:
    banner-mode: off

  r2dbc:
    url: r2dbc:postgresql://localhost:5432/skeleton_repository
    username: postgres
    password: postgres
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30s
      validation-query: SELECT 1
  sql:
    init:
      mode: always

market:
  upload:
    maxSize: 5242880
    dir: /home/alexlakers/my-market

logging:
  level:
    root: WARN
    com.alex.market: INFO
    com.alex.market.service: DEBUG
    com.alex.market.repository: INFO
    org.springframework.r2dbc: WARN
    org.springframework.transaction: INFO
  file:
    name: ${MARKET_DIR:/home/alexlakers/my-market}/market.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    console: "%d{HH:mm:ss} %-5level %logger{36} - %msg%n"