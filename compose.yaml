services:
  database-mvc:
    image: postgres:17.0
    ports:
      - "${DB_HOST_PORT_MARKET}:${DB_PORT_MARKET}"
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER_MARKET}
      - POSTGRES_PASSWORD=${DB_PASS_MARKET}
      - POSTGRES_DB=${DB_NAME_MARKET}
    volumes:
      - db-data-mvc:/var/lib/postgresql/data
    networks:
      backend-net:

  database-payment:
    image: postgres:17.0
    ports:
      - "${DB_HOST_PORT_PAYMENT}:${DB_PORT_PAYMENT}"
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER_PAYMENT}
      - POSTGRES_PASSWORD=${DB_PASS_PAYMENT}
      - POSTGRES_DB=${DB_NAME_PAYMENT}
    volumes:
      - db-data-rest:/var/lib/postgresql/data
    networks:
      backend-net:

  market-mvc:
    build:
      context: .
      dockerfile: market-mvc/Dockerfile
    image: market
    restart: always
    ports:
      - "${APP_HOST_PORT_MARKET}:${APP_PORT_MARKET}"
    environment:
      - DB_USER_MARKET=${DB_USER_MARKET}
      - DB_PASS_MARKET=${DB_PASS_MARKET}
      - DB_HOST_MARKET=${DB_HOST_MARKET}
      - DB_PORT_MARKET=${DB_PORT_MARKET}
      - DB_NAME_MARKET=${DB_NAME_MARKET}
      - REDIS_HOST_MARKET=${REDIS_HOST_MARKET}
      - MAX_IMAGE_SIZE_MARKET=${MAX_IMAGE_SIZE_MARKET}
      - DIR_MARKET=${DIR_MARKET}
      - PAYMENT_SERVICE_URL_MARKET=${PAYMENT_SERVICE_URL_MARKET}
    networks:
      backend-net:
    depends_on:
      - database-mvc

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    image: payment
    restart: always
    ports:
      - "${APP_HOST_PORT_PAYMENT}:${APP_PORT_PAYMENT}"
    environment:
        - DB_USER_PAYMENT=${DB_USER_PAYMENT}
        - DB_PASS_PAYMENT=${DB_PASS_PAYMENT}
        - DB_HOST_PAYMENT=${DB_HOST_PAYMENT}
        - DB_PORT_PAYMENT=${DB_PORT_PAYMENT}
        - DB_NAME_PAYMENT=${DB_NAME_PAYMENT}
        - DIR_PAYMENT=${DIR_PAYMENT}
    networks:
      backend-net:
    depends_on:
      - database-payment


  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_LOGIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASS}
    ports:
      - "${KEYCLOAK_HOST_PORT}:${KEYCLOAK_PORT}"
    restart: always
    command:
      - start-dev
    networks:
      backend-net:
        aliases:
          - keycloak


  redisserver:
    image: redis:alpine
    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"
    networks:
      backend-net:

volumes:
  db-data-mvc:
  db-data-rest:

networks:
  backend-net: