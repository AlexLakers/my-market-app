services:
  database-mvc:
    image: postgres:17.0
    ports:
      - "${DB_HOST_PORT_MARKET}:${DB_PORT_MARKET}"
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER_MARKET}
      - POSTGRES_PASSWORD=${DB_PASS_MARKET}
      - POSTGRES_DB=${DB_NAME_MARKET}
    volumes:
      - db-data-mvc:/var/lib/postgresql/data
    networks:
      backend-net:

  market-mvc:
    build:
      context: .
      dockerfile: market-mvc/Dockerfile
    image: market
    restart: always
    ports:
      - "${APP_HOST_PORT_MARKET}:${APP_PORT_MARKET}"
    environment:
      - DB_USER_MARKET=${DB_USER_MARKET}
      - DB_PASS_MARKET=${DB_PASS_MARKET}
      - DB_HOST_MARKET=${DB_HOST_MARKET}
      - DB_PORT_MARKET=${DB_PORT_MARKET}
      - DB_NAME_MARKET=${DB_NAME_MARKET}
      - REDIS_HOST_MARKET=${REDIS_HOST_MARKET}
      - MAX_IMAGE_SIZE_MARKET=${MAX_IMAGE_SIZE_MARKET}
      - DIR_MARKET=${DIR_MARKET}
    networks:
      backend-net:
    depends_on:
      - database-mvc

  redisserver:
    image: redis:alpine
    ports:
      - 6379:6379
    environment:
      REDIS_PASSWORD: mypass
    command: [ "sh", "-c","exec redis-server --requirepass mypass" ]
    networks:
      backend-net:

volumes:
  db-data-mvc:
  db-data-rest:

networks:
  backend-net: