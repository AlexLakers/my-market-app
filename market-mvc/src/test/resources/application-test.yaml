spring:
  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.xml
    contexts: test

  sql:
    init:
      mode: never

  threads:
    virtual:
      enabled: false

market:
  upload:
    maxSize: 1048576
    dir: ${java.io.tmpdir}/market-test

logging:
  level:
    root: WARN
    com.alex.market: INFO
    com.alex.market.service: DEBUG
    org.testcontainers: DEBUG
    org.springframework.test: DEBUG
    org.springframework.r2dbc: WARN
  file:
    name: ${java.io.tmpdir}/market-test.log
