<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <div class="ms-auto"></div>
                <a href="/" class="btn btn-secondary bi bi-arrow-left-square"> Главная</a>
                <a href="/login" class="btn btn-secondary bi bi-arrow-left-square"> Войти</a>
            </div>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <form th:action="@{/register}" method="post" id="registrationForm" th:object="${user}"
                  class="p-4 border rounded shadow-sm bg-white">

                <h5 class="mb-3 text-success">Регистрация</h5>

                <div th:if="${errors}" class="alert alert-danger mb-3">
                    <div th:each="error : ${errors}" th:text="${error.defaultMessage}">Ошибка регистрации</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Имя</label>
                        <input type="text" name="firstname" id="firstname" th:value="*{firstname}"
                               class="form-control" placeholder="Введите имя">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Фамилия</label>
                        <input type="text" name="lastname" id="lastname" th:value="*{lastname}"
                               class="form-control" placeholder="Введите фамилию">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" name="username" th:value="*{username}" id="username"
                           class="form-control" placeholder="Введите логин">
                </div>

                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password"  id="password"
                           class="form-control" placeholder="Введите пароль">
                </div>

                <div class="mb-3">
                    <label class="form-label">Дата рождения</label>
                    <input type="date" name="birthday" th:value="*{birthday}" id="birthday"
                           class="form-control">
                </div>
                <!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"> -->

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-success">Зарегистрироваться</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
