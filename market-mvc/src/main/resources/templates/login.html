<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">
<div class="container p-2">
    <div class="row p-2">
        <div class="col">
            <div class="hstack gap-3">
                <div class="ms-auto"></div>
                <a href="/" class="btn btn-secondary bi bi-arrow-left-square"> Главная</a>
                <a href="/register" class="btn btn-secondary bi bi-arrow-left-square"> Регистрация</a>
            </div>
        </div>
    </div>


    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <form th:action="@{/login}" method="post"
                  class="p-4 border rounded shadow-sm bg-white">

                <h5 class="mb-3 text-success">Вход в систему</h5>

                <div th:if="${hasError}" class="alert alert-danger mb-3">
                    Ошибка аутентификации: Неверный логин или пароль
                </div>

                <div th:if="${hasLogout}" class="alert alert-success mb-3">
                    Вы успешно вышли из системы
                </div>

                <div class="mb-3">
                    <label class="form-label">Логин</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Введите логин" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Введите пароль" required>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-success">Войти</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
